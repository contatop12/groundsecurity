<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Página não encontrada | Ground Security Systems</title>
    <meta name="description" content="A página que você procurou não existe ou mudou de endereço.">
    <!-- @include head -->
    <meta name="robots" content="noindex, follow">
  </head>
  <body>
<!-- @include header -->

    <main id="conteudo">
      <section class="notfound">
        <div class="container--narrow">
          <div class="dome dome--animate" aria-hidden="true" style="--img: linear-gradient(135deg, #003f5e, #008878)">
            <div class="dome__layer dome__layer--a"><span style="--i:0"></span><span style="--i:1"></span><span style="--i:2"></span><span style="--i:3"></span><span style="--i:4"></span></div>
            <div class="dome__layer dome__layer--b"><span style="--i:0"></span><span style="--i:1"></span><span style="--i:2"></span><span style="--i:3"></span><span style="--i:4"></span><span style="--i:5"></span></div>
          </div>
          <h1 style="font-size: var(--fs-3xl); margin-bottom: 18px">Esta página saiu do nosso campo de visão</h1>
          <p class="lead" style="margin: 0 auto 32px">O endereço não existe ou mudou. Veja as soluções, volte para o início ou fale direto com um especialista.</p>
          <div class="cluster" style="justify-content: center; --gap: 12px">
            <a class="btn btn--lg" href="/">Voltar para o início</a>
            <a class="btn btn--ghost btn--lg" href="/solucoes/">Ver soluções</a>
            <a class="btn btn--wa btn--lg" href="{{wa}}" target="_blank" rel="noopener" data-track="whatsapp-404"><svg class="icon icon--fill" aria-hidden="true"><use href="#i-wa"/></svg><span>WhatsApp</span></a>
          </div>
        </div>
      </section>
    </main>

<!-- @include footer -->
  </body>
</html>
